[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isis"
version = "0.1.0"
description = "Navigate a markdown corpus: collect passages into task documents and search with BM25 + small embeddings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyStemmer>=2.2",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface_hub>=0.20",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.scripts]
isis = "isis.cli:main"

[tool.setuptools.packages.find]
include = ["isis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
